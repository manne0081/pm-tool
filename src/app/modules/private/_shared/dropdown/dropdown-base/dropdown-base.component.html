<!-- OUTER DROPDOWN -->
<div class="dropdown" (click)="$event.stopPropagation()">

    <!-- INNER DROPDOWN > Dropdown-Button -->
    <!-- <app-dropdown-button [dropdownId]="dropdownId" [buttonType]="buttonType" [buttonValue]="buttonValue" [buttonIcon]="buttonIcon"></app-dropdown-button> -->
    <app-dropdown-button [ddBaseId]="ddBaseId" [dropdownId]="dropdownId" [buttonType]="buttonType" [buttonValue]="buttonValue" [buttonIcon]="buttonIcon"></app-dropdown-button>

    <!-- INNER DROPDOWN > Dropdown-Content -->
    <app-dropdown-data-sort
        *ngIf="dropdownType === 'sort'"
        [ddBaseId]="ddBaseId" [dropdownId]="dropdownId" [dropdownContent]="dropdownContent">
    </app-dropdown-data-sort>

    <app-dropdown-data-filter
        *ngIf="dropdownType === 'filter'"
        [ddBaseId]="ddBaseId" [dropdownId]="dropdownId" [dropdownContent]="dropdownContent">
    </app-dropdown-data-filter>

</div>
